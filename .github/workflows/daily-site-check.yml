name: Daily website availability check

on:
  schedule:
    # Poll every 15 minutes; the script only performs checks at its
    # gradually-shifting daily target time.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check configured websites and append CSV log
        id: site_check
        continue-on-error: true
        env:
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        run: python scripts/check_sites.py

      - name: Commit and push daily access log
        if: always()
        run: |
          if [ -f logs/daily-access-log.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logs/daily-access-log.csv
            if ! git diff --cached --quiet; then
              git commit -m "Update daily website access log"
              git push
            else
              echo "No log changes to commit."
            fi
          else
            echo "Log file was not generated; nothing to commit."
          fi

      - name: Mark run failed if any website could not be reached
        if: steps.site_check.outcome == 'failure'
        run: exit 1
